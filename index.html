<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Voice Translator</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#1a1a2e);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  text-shadow: 0 0 15px cyan;
}

.box {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 25px rgba(0,255,255,0.2);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
}

textarea {
  width: 100%;
  height: 130px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 16px;
  background: rgba(0,0,0,0.3);
  color: white;
}

select {
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: rgba(0,0,0,0.4);
  color: white;
}

button {
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg,#00c6ff,#7f00ff);
  color: white;
  font-weight: bold;
  margin: 5px;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 20px rgba(0,255,255,0.3);
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="container">
<h1>🎤 3D Voice Translator</h1>

<div class="box">

<textarea id="inputText" placeholder="Type or use voice..." ></textarea>

<div class="row">
<select id="fromLang"></select>
<select id="toLang"></select>
</div>

<div class="row">
<button onclick="startVoice()">🎤 Speak</button>
<button onclick="translateText()">Translate</button>
<button onclick="speakText()">🔊 Speak Result</button>
<button onclick="swapLang()">⇄ Swap</button>
</div>

<textarea id="outputText" placeholder="Translation..." readonly></textarea>

</div>
</div>

<script>

/* 🌍 Languages */
const languages = {
"auto":"Auto Detect",
"en":"English",
"ur":"Urdu",
"pa":"Punjabi",
"hi":"Hindi",
"ar":"Arabic",
"fr":"French",
"de":"German",
"es":"Spanish",
"it":"Italian",
"pt":"Portuguese",
"ru":"Russian",
"zh":"Chinese",
"ja":"Japanese",
"ko":"Korean",
"tr":"Turkish",
"nl":"Dutch",
"bn":"Bengali",
"ta":"Tamil",
"te":"Telugu",
"gu":"Gujarati",
"mr":"Marathi",
"fa":"Persian",
"id":"Indonesian",
"ms":"Malay",
"th":"Thai"
};

const fromLang = document.getElementById("fromLang");
const toLang = document.getElementById("toLang");

for (let key in languages) {
fromLang.innerHTML += `<option value="${key}">${languages[key]}</option>`;
toLang.innerHTML += `<option value="${key}">${languages[key]}</option>`;
}

fromLang.value = "auto";
toLang.value = "ur";

/* 🔁 Translate */
async function translateText() {
let text = document.getElementById("inputText").value;
if (!text) return;

let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang.value}&tl=${toLang.value}&dt=t&q=${encodeURIComponent(text)}`;

let res = await fetch(url);
let data = await res.json();

let translated = data[0].map(t => t[0]).join("");
document.getElementById("outputText").value = translated;
}

/* 🔄 Swap */
function swapLang() {
let temp = fromLang.value;
fromLang.value = toLang.value;
toLang.value = temp;
}

/* 🎤 Voice to Text */
function startVoice() {
let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
alert("Your browser does not support Voice Recognition");
return;
}

let recognition = new SpeechRecognition();
recognition.lang = fromLang.value === "auto" ? "en-US" : fromLang.value;
recognition.interimResults = false;

recognition.start();

recognition.onresult = function(event) {
document.getElementById("inputText").value = event.results[0][0].transcript;
};

recognition.onerror = function() {
alert("Voice recognition error");
};
}

/* 🔊 Text to Speech */
function speakText() {
let text = document.getElementById("outputText").value;
if (!text) return;

let speech = new SpeechSynthesisUtterance(text);
speech.lang = toLang.value;
speech.rate = 1;
speech.pitch = 1;

window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
