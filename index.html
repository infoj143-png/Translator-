<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Pro Translator</title>

<style>
/* 🌈 Animated Background */
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#1a1a2e);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* 📦 Container */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  text-shadow: 0 0 15px cyan;
}

/* 💎 Glass Box */
.box {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 25px rgba(0,255,255,0.2);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
}

/* ✍️ Inputs */
textarea {
  width: 100%;
  height: 130px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 16px;
  background: rgba(0,0,0,0.3);
  color: white;
  box-shadow: inset 0 0 10px rgba(0,255,255,0.1);
}

/* 🔽 Select */
select {
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: rgba(0,0,0,0.4);
  color: white;
}

/* 🔘 Buttons */
button {
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg,#00c6ff,#7f00ff);
  color: white;
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
  transition: 0.3s;
}

button:hover {
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 10px 25px rgba(0,255,255,0.4);
}

/* 📐 Layout */
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}

.small {
  text-align: right;
  font-size: 12px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 3D Pro Translator</h1>

<div class="box">

<!-- INPUT -->
<textarea id="inputText" placeholder="Type text here..." oninput="countChars()"></textarea>
<div class="small" id="charCount">0 characters</div>

<!-- LANGUAGES -->
<div class="row">
<select id="fromLang"></select>
<button onclick="swapLang()">⇄ Swap</button>
<select id="toLang"></select>
</div>

<!-- BUTTONS -->
<div class="row">
<button onclick="translateText()">Translate</button>
<button onclick="copyText()">Copy</button>
<button onclick="clearAll()">Clear</button>
</div>

<!-- OUTPUT -->
<textarea id="outputText" placeholder="Translation..." readonly></textarea>

</div>
</div>

<script>

/* 🌐 25 LANGUAGES */
const languages = {
"auto":"Auto Detect",
"en":"English",
"ur":"Urdu",
"pa":"Punjabi",
"hi":"Hindi",
"ar":"Arabic",
"fr":"French",
"de":"German",
"es":"Spanish",
"it":"Italian",
"pt":"Portuguese",
"ru":"Russian",
"zh":"Chinese",
"ja":"Japanese",
"ko":"Korean",
"tr":"Turkish",
"nl":"Dutch",
"bn":"Bengali",
"ta":"Tamil",
"te":"Telugu",
"gu":"Gujarati",
"mr":"Marathi",
"fa":"Persian",
"id":"Indonesian",
"ms":"Malay",
"th":"Thai"
};

/* dropdown fill */
const fromLang = document.getElementById("fromLang");
const toLang = document.getElementById("toLang");

for (let key in languages) {
fromLang.innerHTML += `<option value="${key}">${languages[key]}</option>`;
toLang.innerHTML += `<option value="${key}">${languages[key]}</option>`;
}

fromLang.value = "auto";
toLang.value = "ur";

/* 🔁 Translate */
async function translateText() {
let text = document.getElementById("inputText").value;
if (!text) return;

let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang.value}&tl=${toLang.value}&dt=t&q=${encodeURIComponent(text)}`;

let res = await fetch(url);
let data = await res.json();

let translated = data[0].map(t => t[0]).join("");
document.getElementById("outputText").value = translated;
}

/* 🔄 Swap */
function swapLang() {
let temp = fromLang.value;
fromLang.value = toLang.value;
toLang.value = temp;
}

/* 📋 Copy */
function copyText() {
let out = document.getElementById("outputText");
out.select();
document.execCommand("copy");
alert("Copied!");
}

/* 🧹 Clear */
function clearAll() {
document.getElementById("inputText").value = "";
document.getElementById("outputText").value = "";
document.getElementById("charCount").innerText = "0 characters";
}

/* 🔢 Counter */
function countChars() {
let len = document.getElementById("inputText").value.length;
document.getElementById("charCount").innerText = len + " characters";
}

</script>

</body>
  </html>
